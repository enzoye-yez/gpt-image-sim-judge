<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图像相似度标注</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --fg:#1b1f24; --muted:#5c6570; --line:#dde1e6; --accent:#2f5bd3; --sel:#e8eefc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15181c; --panel:#1d2127; --fg:#e6e8eb; --muted:#9aa3ad; --line:#30363d; --accent:#7aa2ff; --sel:#25314d; } }
:root[data-theme="dark"] { --bg:#15181c; --panel:#1d2127; --fg:#e6e8eb; --muted:#9aa3ad; --line:#30363d; --accent:#7aa2ff; --sel:#25314d; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif; }
.wrap { max-width:1280px; margin:0 auto; padding:16px; display:grid; gap:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
h1 { font-size:20px; margin:0; }
.muted { color:var(--muted); font-size:13.5px; }
.bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
input[type=text] { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
button { font:inherit; padding:8px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer; }
button.pick { min-width:150px; font-weight:600; }
button.on { background:var(--sel); border-color:var(--accent); color:var(--accent); }
button:disabled { opacity:.45; cursor:default; }
.query { font-size:14px; background:color-mix(in srgb, var(--fg) 5%, transparent); border-radius:8px; padding:8px 10px; }
.grid { display:grid; gap:12px; grid-template-columns: repeat(3, minmax(0,1fr)); }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
figure { margin:0; display:grid; gap:6px; align-content:start; }
figure img { width:100%; height:auto; max-height:62vh; object-fit:contain; border-radius:8px; border:1px solid var(--line); background:color-mix(in srgb, var(--fg) 4%, transparent); cursor:zoom-in; }
figcaption { font-weight:700; }
figure.ref figcaption { color:var(--accent); }
.prog { height:6px; background:var(--line); border-radius:99px; overflow:hidden; flex:1; min-width:160px; }
.prog > div { height:100%; background:var(--accent); width:0; }
kbd { font-size:12px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; }
#zoom { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:9; cursor:zoom-out; }
#zoom img { max-width:96vw; max-height:96vh; }
</style></head>
<body><div class="wrap">
  <div class="card" style="display:grid;gap:8px">
    <h1>哪张候选图更像参照图？</h1>
    <div class="muted">每题一张<b>参照图</b>和两张候选图 A、B，三张图都是同一条需求下出的图。请按"看起来是不是同一个设计"来判断：画了什么、构图、配色和光线、风格、版式、文字，都算。不用管哪张更好看，只看哪张<b>更接近参照图</b>。两张差不多就选"差不多"；图打不开或明显坏了选"图有问题"。点图可以放大。快捷键：<kbd>1</kbd> A 更像，<kbd>2</kbd> B 更像，<kbd>3</kbd> 差不多，<kbd>4</kbd> 图有问题，<kbd>←</kbd><kbd>→</kbd> 上一题 / 下一题。</div>
    <div class="bar">
      <label>你的名字 <input type="text" id="rater" placeholder="如 alice" maxlength="40"></label>
      <button id="go">开始 / 继续</button>
      <div class="prog"><div id="pbar"></div></div>
      <span class="muted" id="ptext"></span>
    </div>
  </div>
  <div class="card" id="task" style="display:none;gap:12px">
    <div class="bar"><b id="qno"></b><span class="muted" id="state"></span></div>
    <div class="query" id="query"></div>
    <div class="grid">
      <figure class="ref"><img id="iref" alt="参照图"><figcaption>参照图</figcaption></figure>
      <figure><img id="iA" alt="候选图 A"><figcaption>候选图 A</figcaption></figure>
      <figure><img id="iB" alt="候选图 B"><figcaption>候选图 B</figcaption></figure>
    </div>
    <div class="bar">
      <button class="pick" data-c="A">A 更像（1）</button>
      <button class="pick" data-c="B">B 更像（2）</button>
      <button class="pick" data-c="same">差不多（3）</button>
      <button class="pick" data-c="bad">图有问题（4）</button>
    </div>
    <div class="bar">
      <input type="text" id="note" placeholder="备注（可选，比如主要看了哪里）" style="flex:1;min-width:220px" maxlength="500">
      <button id="prev">← 上一题</button><button id="next">下一题 →</button><button id="first">跳到第一道没做的</button>
    </div>
  </div>
  <div class="card muted" id="done" style="display:none">全部做完了，谢谢！可以随时回来改答案（同一题以最后一次为准）。</div>
</div>
<div id="zoom"><img alt=""></div>
<script>
const $ = id => document.getElementById(id);
let items = [], mine = {}, i = 0, rater = '';
try { $('rater').value = localStorage.getItem('simannot_rater') || ''; } catch (e) {}
const api = (p, o) => fetch(p, o).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
function prog() {
  const n = items.filter(x => mine[x.iid]).length;
  $('pbar').style.width = (100 * n / Math.max(1, items.length)) + '%'; $('ptext').textContent = `${n} / ${items.length}`;
  $('done').style.display = n === items.length && items.length ? 'block' : 'none';
}
function show() {
  const it = items[i]; if (!it) return;
  $('task').style.display = 'grid'; $('qno').textContent = `第 ${i + 1} 题 / 共 ${items.length} 题`;
  $('query').textContent = '需求：' + it.query;
  for (const k of ['ref', 'A', 'B']) $('i' + k).src = `img/${it.iid}_${k}.webp`;
  const v = mine[it.iid];
  document.querySelectorAll('.pick').forEach(b => b.classList.toggle('on', !!v && v.choice === b.dataset.c));
  $('note').value = v ? (v.note || '') : '';
  $('state').textContent = v ? '已作答（可以改）' : '未作答';
  if (items[i + 1]) new Image().src = `img/${items[i + 1].iid}_ref.webp`;
  prog();
}
function firstOpen() { const k = items.findIndex(x => !mine[x.iid]); i = k < 0 ? items.length - 1 : k; show(); }
async function vote(c) {
  const it = items[i]; if (!it || !rater) return;
  const note = $('note').value.trim();
  try { await api('api/vote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rater, iid: it.iid, choice: c, note }) }); }
  catch (e) { $('state').textContent = '保存失败，请重试：' + e.message; return; }
  mine[it.iid] = { choice: c, note };
  if (i < items.length - 1) { i++; show(); } else show();
}
$('go').onclick = async () => {
  rater = $('rater').value.trim(); if (!rater) { $('rater').focus(); return; }
  try { localStorage.setItem('simannot_rater', rater); } catch (e) {}
  items = await api('api/items'); mine = await api('api/mine?rater=' + encodeURIComponent(rater)); firstOpen();
};
document.querySelectorAll('.pick').forEach(b => b.onclick = () => vote(b.dataset.c));
$('prev').onclick = () => { if (i > 0) { i--; show(); } };
$('next').onclick = () => { if (i < items.length - 1) { i++; show(); } };
$('first').onclick = firstOpen;
document.addEventListener('keydown', e => {
  if (!items.length || e.target.tagName === 'INPUT') return;
  const m = { '1': 'A', '2': 'B', '3': 'same', '4': 'bad' };
  if (m[e.key]) vote(m[e.key]); else if (e.key === 'ArrowLeft') $('prev').click(); else if (e.key === 'ArrowRight') $('next').click();
});
document.querySelectorAll('figure img').forEach(im => im.onclick = () => { $('zoom').querySelector('img').src = im.src; $('zoom').style.display = 'flex'; });
$('zoom').onclick = () => { $('zoom').style.display = 'none'; };
</script></body></html>
